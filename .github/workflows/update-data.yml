name: Update Twitch data

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (best-effort; GitHub may delay)
  workflow_dispatch: {} # run manually from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "api/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Twitch data
        run: node scripts/fetch-data.js
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Build consolidated events.json (for the mobile app)
        run: node scripts/generate-events.js
      - name: Announce on Discord
        run: node scripts/notify-discord.js
        env:
          DISCORD_WEBHOOK_BADGES: ${{ secrets.DISCORD_WEBHOOK_BADGES }}
          DISCORD_WEBHOOK_EVENTS: ${{ secrets.DISCORD_WEBHOOK_EVENTS }}
          DISCORD_WEBHOOK_EMOTES: ${{ secrets.DISCORD_WEBHOOK_EMOTES }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_EVENTS: ${{ secrets.DISCORD_ROLE_EVENTS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api
          git diff --cached --quiet || git commit -m "Update Twitch data"
          git push
